<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Maddox OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: full-bleed dark "web OS" — login overlay, top bar, app dock, swapping app view, game modal */
:root{
  --bg:#070b16; --bg2:#0d1426; --panel:#121b31; --panel2:#18233f;
  --line:#243150; --fg:#eaf0ff; --mut:#93a2c7; --dim:#5f6f93;
  --accent:#4b7bff; --accent2:#7a5cff; --good:#36d399; --warn:#ffcf5c; --bad:#ff5c7a;
  --gold:#ffd34d;
  --r:16px; --r2:12px;
  color-scheme:dark;
  --ff:'Outfit',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --fm:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;font-family:var(--ff);background:var(--bg);color:var(--fg);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
h1,h2,h3{text-wrap:balance;margin:0}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px}

/* animated backdrop */
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:
  radial-gradient(1200px 800px at 15% 10%,#17224180,transparent 60%),
  radial-gradient(1000px 700px at 85% 90%,#2a1b5560,transparent 60%),
  linear-gradient(160deg,var(--bg),var(--bg2))}
#bg .blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;mix-blend-mode:screen;animation:float 18s ease-in-out infinite}
#bg .b1{width:460px;height:460px;background:var(--accent);left:-120px;top:-80px}
#bg .b2{width:520px;height:520px;background:var(--accent2);right:-140px;bottom:-120px;animation-duration:22s}
#bg .b3{width:360px;height:360px;background:#2bd1c9;left:40%;top:50%;animation-duration:26s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-30px) scale(1.12)}}
@media (prefers-reduced-motion:reduce){#bg .blob{animation:none}}

.wrap{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}

/* ---------- login ---------- */
#login{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-left)) ;background:rgba(5,8,18,.6);backdrop-filter:blur(8px)}
.card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:22px;
  padding:26px;width:min(400px,94vw);box-shadow:0 30px 80px #000a}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.logo .mark{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:grid;place-items:center;font-weight:800;font-size:22px;box-shadow:0 8px 24px #4b7bff55}
.logo h1{font-size:24px;letter-spacing:-.5px}
.sub{color:var(--mut);font-size:13px;margin:2px 0 18px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--mut);margin-bottom:6px;letter-spacing:.3px}
.in{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#0a1120;color:var(--fg);font-size:15px;outline:none}
.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px #4b7bff33}
.btn{border:1px solid var(--line);background:var(--panel2);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;transition:.15s;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;box-shadow:0 8px 24px #4b7bff44}
.btn.block{width:100%}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.gold{background:linear-gradient(135deg,#ffb020,var(--gold));border:none;color:#201600}
.btn.danger{background:#2a1320;border-color:#5e2338;color:#ff8fa6}
.row{display:flex;gap:10px}
.msg{font-size:13px;margin-top:10px;min-height:18px}
.msg.err{color:var(--bad)} .msg.ok{color:var(--good)}
.hint{font-size:12px;color:var(--dim);margin-top:14px;text-align:center;line-height:1.5}
.tiny{font-size:11px;color:var(--dim)}

/* ---------- top bar ---------- */
#top{display:flex;align-items:center;gap:12px;padding:10px max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left));
  padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--line);
  background:#0a1120cc;backdrop-filter:blur(10px);position:relative;z-index:20}
#top .brand{display:flex;align-items:center;gap:9px;font-weight:700}
#top .brand .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;font-size:15px}
#clock{font-family:var(--fm);font-size:13px;color:var(--mut);margin-left:auto;text-align:right;line-height:1.25}
#clock b{color:var(--fg);font-size:15px;display:block}
.me{display:flex;align-items:center;gap:10px;padding:5px 6px 5px 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
.me .nm{font-weight:600;font-size:14px}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.3px}
.b-user{background:#17233f;color:#9fb4e6} .b-admin{background:#14312a;color:#5fe6b4}
.b-superadmin{background:#2a1f45;color:#c3a6ff} .b-owner{background:#3a2c08;color:var(--gold)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}

/* ---------- main ---------- */
#main{flex:1;display:flex;min-height:0}
#dock{width:76px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;padding:12px 10px;border-right:1px solid var(--line);background:#0a1120aa;overflow-y:auto}
.dapp{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 4px;border-radius:14px;border:1px solid transparent;color:var(--mut);font-size:10px;font-weight:600;transition:.15s;background:none;width:100%}
.dapp .ic{font-size:21px;line-height:1}
.dapp:hover{background:var(--panel);color:var(--fg)}
.dapp.on{background:linear-gradient(135deg,#4b7bff33,#7a5cff33);border-color:var(--accent);color:var(--fg)}
#view{flex:1;min-width:0;overflow-y:auto;padding:20px max(16px,env(safe-area-inset-right)) 28px max(16px,env(safe-area-inset-left))}
.vhead{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.vhead h2{font-size:24px;letter-spacing:-.5px}
.vhead .pill{font-size:12px;color:var(--mut);border:1px solid var(--line);padding:4px 10px;border-radius:999px}

.grid{display:grid;gap:14px}
.panel{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel h3{font-size:15px;margin-bottom:10px}

/* home */
.hero{text-align:center;padding:26px 10px 8px}
.hero h1{font-size:clamp(28px,6vw,46px);letter-spacing:-1px;background:linear-gradient(120deg,#fff,#9db8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);margin-top:8px}
.search{display:flex;gap:8px;max-width:620px;margin:22px auto 0}
.search .in{flex:1}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px;max-width:900px;margin:26px auto 0}
.tile{position:relative;aspect-ratio:1;border-radius:var(--r2);border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--fg);transition:.15s;padding:8px;text-align:center}
.tile:hover{transform:translateY(-3px);border-color:var(--accent);background:var(--panel2)}
.tile .ic{font-size:30px}
.tile .lb{font-size:12px;font-weight:600;word-break:break-word}
.tile .x{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:#0008;border:1px solid var(--line);font-size:11px;display:none;align-items:center;justify-content:center}
.tile:hover .x{display:flex}
.tile.add{border-style:dashed;color:var(--mut)}

/* game grid */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.gcard{border:1px solid var(--line);border-radius:var(--r2);background:var(--panel);padding:16px;text-align:left;transition:.15s;position:relative;overflow:hidden}
.gcard:hover{transform:translateY(-3px);border-color:var(--accent)}
.gcard .ic{font-size:30px}
.gcard .nm{font-weight:700;margin-top:10px}
.gcard .ds{font-size:12px;color:var(--mut);margin-top:3px;line-height:1.4}
.gcard .hi{font-size:11px;color:var(--gold);margin-top:8px;font-family:var(--fm)}

/* modal */
#modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:14px;background:#030610d9;backdrop-filter:blur(6px)}
#modal.on{display:flex}
.mbox{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:18px;width:min(640px,96vw);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 30px 90px #000b}
.mhead{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.mhead h3{font-size:16px}
.mhead .close{margin-left:auto;width:34px;height:34px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:18px}
.mbody{padding:16px;overflow:auto}
.gwrap{display:flex;flex-direction:column;align-items:center;gap:12px}
canvas{background:#060a14;border:1px solid var(--line);border-radius:12px;touch-action:none;max-width:100%}
.score{font-family:var(--fm);color:var(--mut);font-size:14px}
.score b{color:var(--fg)}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:6px;justify-content:center}
.pad button{border:1px solid var(--line);background:var(--panel2);border-radius:12px;font-size:20px}
.pad .sp{visibility:hidden}

/* tables / admin */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-size:12px;font-weight:600;letter-spacing:.3px}
td .badge{cursor:default}
.note{background:#101a30;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--mut);margin:12px 0}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border:none}
.kv span{color:var(--mut)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);padding:8px 12px;border-radius:10px;font-size:13px;font-weight:600}
.chip.on{border-color:var(--accent);background:var(--panel2)}
textarea.in{min-height:220px;resize:vertical;font-family:var(--fm);line-height:1.5}
.calc{max-width:300px;margin:0 auto}
.calcout{background:#060a14;border:1px solid var(--line);border-radius:12px;padding:16px;text-align:right;font-family:var(--fm);font-size:26px;margin-bottom:10px;overflow:hidden}
.calcgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.calcgrid button{padding:16px 0;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-size:18px;font-weight:600}
.calcgrid button.op{background:#1a2748;color:#9db8ff}
.calcgrid button.eq{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none}
.swatch{width:100%;aspect-ratio:16/7;border-radius:12px;border:2px solid var(--line);cursor:pointer}
.swatch.on{border-color:#fff}

/* popup announcement */
#pop{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:18px;background:#02040ae0;backdrop-filter:blur(4px)}
#pop.on{display:flex}
.popbox{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--accent);border-radius:18px;max-width:min(520px,94vw);text-align:center;overflow:hidden;box-shadow:0 30px 90px #000}
.popbox img{max-width:100%;max-height:50vh;display:block;margin:0 auto}
.popbox .pc{padding:20px}
.popbox h3{font-size:20px;margin-bottom:8px}
.popbox p{color:var(--mut);margin:0 0 16px}

/* toast */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120%);z-index:70;background:var(--panel2);border:1px solid var(--line);padding:11px 18px;border-radius:12px;font-size:14px;transition:.3s;box-shadow:0 10px 30px #0008}
#toast.on{transform:translateX(-50%) translateY(0)}

@media(max-width:620px){
  #dock{flex-direction:row;width:auto;border-right:none;border-bottom:1px solid var(--line);overflow-x:auto;padding:8px}
  #main{flex-direction:column}
  .dapp{min-width:62px;flex:0 0 auto}
  #top .brand span.t{display:none}
}
</style>
</head>
<body>

<div id="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<!-- LOGIN -->
<div id="login">
  <div class="card">
    <div class="logo"><div class="mark">M</div><h1>Maddox OS</h1></div>
    <div class="sub" id="loginsub">Sign in to your desktop</div>
    <div class="field"><label>Username</label><input class="in" id="u" autocomplete="off" placeholder="username"></div>
    <div class="field"><label>Password <span class="tiny">(optional)</span></label><input class="in" id="p" type="password" placeholder="password"></div>
    <div class="row">
      <button class="btn primary block" id="signin">Sign in</button>
      <button class="btn block" id="create">Create account</button>
    </div>
    <div class="msg" id="lmsg"></div>
    <div class="hint">New here? Pick a username and tap <b>Create account</b>.<br><span class="tiny">Accounts are saved in this browser only.</span></div>
  </div>
</div>

<!-- SHELL -->
<div class="wrap" id="shell" hidden>
  <div id="top">
    <div class="brand"><div class="mark">M</div><span class="t">Maddox OS</span></div>
    <div id="clock"><b>--:--</b><span id="cdate"></span></div>
    <div class="me" id="me"></div>
  </div>
  <div id="main">
    <div id="dock"></div>
    <div id="view"></div>
  </div>
</div>

<div id="modal"><div class="mbox">
  <div class="mhead"><h3 id="mtitle">Game</h3><button class="close" id="mclose">×</button></div>
  <div class="mbody" id="mbody"></div>
</div></div>

<div id="pop"><div class="popbox" id="popbox"></div></div>
<div id="toast"></div>

<script>
(function(){
"use strict";
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const TIERS={user:1,admin:2,superadmin:3,owner:4};
const TLAB={user:'User',admin:'Admin',superadmin:'Super Admin',owner:'Owner'};
const KEY='maddoxos_v1';

/* ---------- state ---------- */
function freshState(){return {accounts:[{u:'maddox',p:'maddox',tier:'owner',created:Date.now(),data:{}}],announce:null};}
let state=load()||freshState();
let me=null; // current account object
let appIntervals=[];
function setAppInterval(fn,ms){const id=setInterval(fn,ms);appIntervals.push(id);return id;}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.accounts)return d;}catch(e){}return null;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function acct(u){return state.accounts.find(a=>a.u.toLowerCase()===String(u).toLowerCase());}
function udata(){me.data=me.data||{};return me.data;}

function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),2200);}

/* ---------- auth (salted SHA-256 password hashing) ---------- */
async function sha(str){try{if(window.crypto&&crypto.subtle){const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');}}catch(e){}let h=5381;for(let i=0;i<str.length;i++)h=((h*33)^str.charCodeAt(i))>>>0;return 'x'+h.toString(16);}
function makeSalt(){const a=new Uint8Array(10);try{crypto.getRandomValues(a);}catch(e){for(let i=0;i<a.length;i++)a[i]=Math.floor(Math.random()*256);}return [...a].map(b=>b.toString(16).padStart(2,'0')).join('');}
async function setPw(acctObj,pw){acctObj.salt=makeSalt();acctObj.hash=await sha(acctObj.salt+':'+pw);delete acctObj.p;}
async function checkPw(acctObj,pw){if(acctObj.hash)return acctObj.hash===await sha((acctObj.salt||'')+':'+pw);if((acctObj.p||'')===pw){await setPw(acctObj,pw);save();return true;}return false;}
$('#signin').onclick=async()=>{
  const u=$('#u').value.trim(), p=$('#p').value;
  const lm=$('#lmsg'); lm.className='msg';
  if(!u){lm.textContent='Enter a username.';lm.classList.add('err');return;}
  const a=acct(u);
  if(!a){lm.textContent='No account with that name. Try Create account.';lm.classList.add('err');return;}
  if(!(await checkPw(a,p))){lm.textContent='Wrong password.';lm.classList.add('err');return;}
  save(); enter(a);
};
$('#create').onclick=async()=>{
  const u=$('#u').value.trim(), p=$('#p').value;
  const lm=$('#lmsg'); lm.className='msg';
  if(!u){lm.textContent='Pick a username first.';lm.classList.add('err');return;}
  if(acct(u)){lm.textContent='That name is taken — sign in instead.';lm.classList.add('err');return;}
  if(p.length<4){lm.textContent='Pick a password of at least 4 characters.';lm.classList.add('err');return;}
  const a={u,tier:'user',created:Date.now(),data:{}}; await setPw(a,p);
  state.accounts.push(a); save(); enter(a);
};
$('#p').addEventListener('keydown',e=>{if(e.key==='Enter')$('#signin').click();});
$('#u').addEventListener('keydown',e=>{if(e.key==='Enter')$('#p').focus();});

function enter(a){
  me=a; $('#login').style.display='none'; $('#shell').hidden=false;
  renderMe(); buildDock(); open('home');
  if(state.announce) showPop(state.announce);
}
function logout(){me=null;$('#shell').hidden=true;$('#login').style.display='flex';$('#u').value='';$('#p').value='';$('#lmsg').textContent='';}

function renderMe(){
  const init=me.u[0].toUpperCase();
  $('#me').innerHTML=`<span class="nm">${esc(me.u)}</span><span class="badge b-${me.tier}">${TLAB[me.tier]}</span><div class="av">${init}</div>`;
  $('#me').onclick=()=>open('settings');
}
function rank(){return TIERS[me.tier]||1;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ---------- dock / router ---------- */
const APPS=[
  {id:'home',ic:'🏠',nm:'Home'},
  {id:'notes',ic:'📝',nm:'Notes'},
  {id:'calc',ic:'🧮',nm:'Calc'},
  {id:'paint',ic:'🎨',nm:'Paint'},
  {id:'timer',ic:'⏱️',nm:'Timer'},
  {id:'dice',ic:'🎲',nm:'Dice'},
  {id:'todo',ic:'✅',nm:'To-Do'},
  {id:'settings',ic:'⚙️',nm:'Settings'},
  {id:'admin',ic:'🛡️',nm:'Admin',min:2},
];
function buildDock(){
  const d=$('#dock'); d.innerHTML='';
  APPS.forEach(a=>{
    if(a.min&&rank()<a.min) return;
    const b=document.createElement('button');
    b.className='dapp'; b.dataset.app=a.id;
    b.innerHTML=`<span class="ic">${a.ic}</span>${a.nm}`;
    b.onclick=()=>open(a.id);
    d.appendChild(b);
  });
  const lo=document.createElement('button');
  lo.className='dapp'; lo.innerHTML='<span class="ic">⏻</span>Log out'; lo.onclick=logout;
  d.appendChild(lo);
}
let cur='home';
function open(id){
  cur=id;
  $$('.dapp').forEach(b=>b.classList.toggle('on',b.dataset.app===id));
  const v=$('#view'); v.scrollTop=0;
  appIntervals.forEach(clearInterval); appIntervals=[];
  ({home:renderHome,notes:renderNotes,calc:renderCalc,paint:renderPaint,timer:renderTimer,dice:renderDice,todo:renderTodo,settings:renderSettings,admin:renderAdmin}[id]||renderHome)(v);
}

/* ---------- clock ---------- */
function tick(){
  const n=new Date();
  $('#clock').querySelector('b').textContent=n.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  $('#cdate').textContent=n.toLocaleDateString([],{weekday:'short',day:'numeric',month:'short'});
}
setInterval(tick,1000); tick();

/* ---------- wallpaper/accent ---------- */
const WALLS=[
  ['Midnight','linear-gradient(160deg,#070b16,#0d1426)'],
  ['Aurora','linear-gradient(160deg,#07131a,#0a2a2a)'],
  ['Grape','linear-gradient(160deg,#0b0718,#241148)'],
  ['Ember','linear-gradient(160deg,#160a0a,#2a1208)'],
  ['Rose','linear-gradient(160deg,#160812,#2a0e22)'],
];

  const swRow=el('div','ctrls');const swStart=el('button','btn primary','Start');const swReset=el('button','btn','Reset');swRow.append(swStart,swReset);sw.append(swD,swRow);
  let swT=0,swRun=false,swiv,t0;
  swStart.onclick=()=>{swRun=!swRun;swStart.textContent=swRun?'Stop':'Start';if(swRun){t0=performance.now()-swT;swiv=setAppInterval(()=>{swT=performance.now()-t0;swD.textContent=(swT/1000).toFixed(1);},100);}else clearInterval(swiv);};
  swReset.onclick=()=>{clearInterval(swiv);swRun=false;swT=0;swStart.textContent='Start';swD.textContent='0.0';};
  const cd=el('div','panel');cd.innerHTML='<h3>Countdown</h3>';const cin=el('input','in');cin.type='number';cin.placeholder='seconds';cin.style.marginBottom='8px';
  const cdD=el('div','calcout','00:00');cdD.style.fontSize='34px';const cdRow=el('div','ctrls');const cdStart=el('button','btn primary','Start');const cdStop=el('button','btn','Stop');cdRow.append(cdStart,cdStop);cd.append(cin,cdD,cdRow);
  let cdLeft=0,cdiv;function fmt(s){const m=Math.floor(s/60),ss=s%60;return String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0');}
  cdStart.onclick=()=>{cdLeft=Math.max(0,parseInt(cin.value)||0);clearInterval(cdiv);cdD.textContent=fmt(cdLeft);cdiv=setAppInterval(()=>{cdLeft--;cdD.textContent=fmt(Math.max(0,cdLeft));if(cdLeft<=0){clearInterval(cdiv);toast('⏰ Time up!');}},1000);};

/* ============ CALC ============ */
function renderCalc(v){
  v.innerHTML=`<div class="vhead"><h2>🧮 Calculator</h2></div>`;
  const wrap=el('div','calc');const out=el('div','calcout','0');const g=el('div','calcgrid');
  wrap.append(out,g);v.appendChild(wrap);
  let cur='0',prev=null,op=null,fresh=false;
  const keys=['C','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','='];
  keys.forEach(k=>{const b=el('button','',k);if('÷×−+='.includes(k))b.className=k==='='?'eq':'op';if(k==='=')b.style.gridColumn='span 1';b.onclick=()=>press(k);g.appendChild(b);});
  function upd(){out.textContent=cur.length>12?(+cur).toPrecision(9):cur;}
  function press(k){
    if(k==='C'){cur='0';prev=null;op=null;fresh=false;}
    else if(k==='±')cur=String(-parseFloat(cur));
    else if(k==='%')cur=String(parseFloat(cur)/100);
    else if('÷×−+'.includes(k)){if(op&&!fresh)calc();prev=parseFloat(cur);op=k;fresh=true;}
    else if(k==='='){calc();op=null;}
    else if(k==='.'){if(!cur.includes('.'))cur+='.';}
    else{if(cur==='0'||fresh){cur=k;fresh=false;}else cur+=k;}
    upd();
  }
  function calc(){if(op==null||prev==null)return;const b=parseFloat(cur);let r=prev;if(op==='+')r+=b;if(op==='−')r-=b;if(op==='×')r*=b;if(op==='÷')r=b?r/b:0;cur=String(Math.round(r*1e9)/1e9);fresh=true;prev=null;}
  upd();
}

/* ============ PAINT ============ */
function renderPaint(v){
  v.innerHTML=`<div class="vhead"><h2>🎨 Paint</h2></div>`;
  const c=mkcanvas(Math.min(540,innerWidth-80),320);c.style.background='#fff';c.style.cursor='crosshair';
  const x=c.getContext('2d');x.lineCap='round';x.lineJoin='round';x.lineWidth=4;x.strokeStyle='#4b7bff';
  const bar=el('div','ctrls');
  const colors=['#4b7bff','#ff5c7a','#36d399','#ffcf5c','#000','#fff'];
  colors.forEach(col=>{const b=el('button');b.style.cssText=`width:30px;height:30px;border-radius:50%;background:${col};border:2px solid var(--line)`;b.onclick=()=>x.strokeStyle=col;bar.appendChild(b);});
  ['2','4','8','16'].forEach(w=>{const b=el('button','btn sm',w+'px');b.onclick=()=>x.lineWidth=+w;bar.appendChild(b);});
  const clr=el('button','btn sm','Clear');clr.onclick=()=>{x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);};
  bar.appendChild(clr);
  v.append(bar,c);
  x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
  let draw=false,lx,ly;
  function pos(e){const r=c.getBoundingClientRect();const p=e.touches?e.touches[0]:e;return[(p.clientX-r.left)*(c.width/r.width),(p.clientY-r.top)*(c.height/r.height)];}
  function down(e){draw=true;[lx,ly]=pos(e);e.preventDefault();}
  function mv(e){if(!draw)return;const[nx,ny]=pos(e);x.beginPath();x.moveTo(lx,ly);x.lineTo(nx,ny);x.stroke();lx=nx;ly=ny;e.preventDefault();}
  function up(){draw=false;}
  c.onmousedown=down;c.onmousemove=mv;window.addEventListener('mouseup',up);
  c.ontouchstart=down;c.ontouchmove=mv;c.ontouchend=up;
}

/* ============ POPUP ============ */
function showPop(a){
  if(!a)return;
  const KEYS='ABCDEFGHJKLMNPQRSTUVWXYZ';const key=KEYS[Math.floor(Math.random()*KEYS.length)];
  const box=$('#popbox');
  box.innerHTML=(a.img?`<img src="${esc(a.img)}" alt="" onerror="this.style.display='none'">`:'')+
    `<div class="pc">${a.title?`<h3>${esc(a.title)}</h3>`:''}${a.msg?`<p>${esc(a.msg)}</p>`:''}<button class="btn primary" id="popclose">Press <b style="font-size:18px">${key}</b> to close</button><div class="tiny" style="margin-top:8px">a random key each time · from ${esc(a.by||'admin')}</div></div>`;
  $('#pop').classList.add('on');
  function done(){window.removeEventListener('keydown',onk);$('#pop').classList.remove('on');}
  function onk(e){if(e.key&&e.key.toUpperCase()===key)done();}
  window.addEventListener('keydown',onk);
  $('#popclose').onclick=done;
}

/* ---------- utils ---------- */
function rnd(n){return Math.floor(Math.random()*n);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()||'#4b7bff';}
function rrect(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}

// autofocus login
